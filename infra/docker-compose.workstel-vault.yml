services:
  functions:
    env_file:
      - path: /opt/workstel/.env.workstel-vault
        required: true
    entrypoint: ['/bin/sh', '/etc/workstel/start-vault.sh']
    secrets:
      - workstel_vault_keyring
    volumes:
      - /opt/workstel/start-vault.sh:/etc/workstel/start-vault.sh:ro
secrets:
  workstel_vault_keyring:
    file: /opt/workstel/keys/vault-keyring.json
